<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>ConsultationForm preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"></head>
<body style="padding:0">
<form class="rt-form" onsubmit="return false"><div><h2 class="rt-form-title">Jadwalkan konsultasi</h2><p class="rt-form-lead">Isi data singkat, lalu konselor KLN menghubungi kamu untuk mengatur jadwal.</p></div>
<div class="rt-field"><label class="rt-label" for="f1">Nama lengkap</label><input class="rt-input" id="f1" autocomplete="name"></div>
<div class="rt-form-grid"><div class="rt-field"><label class="rt-label" for="f2">Nomor WhatsApp</label><input class="rt-input" id="f2" inputmode="tel" placeholder="Contoh: 0812 0000 0000"></div><div class="rt-field"><label class="rt-label" for="f3">Email</label><input class="rt-input" id="f3" type="email" placeholder="nama@email.com"></div></div>
<div class="rt-form-grid"><div class="rt-field"><label class="rt-label" for="f4">Jenjang yang dituju</label><select class="rt-input rt-select" id="f4"><option>Sarjana (S1)</option><option>Magister (S2)</option><option>Doktor (S3)</option><option>Belum yakin</option></select></div><div class="rt-field"><label class="rt-label" for="f5">Negara tujuan</label><input class="rt-input" id="f5" placeholder="Boleh dikosongkan"></div></div>
<div class="rt-field"><label class="rt-label" for="f6">Ceritakan rencanamu</label><textarea class="rt-input rt-textarea" id="f6" placeholder="Bidang yang diminati, target masuk, atau pertanyaan"></textarea><p class="rt-help">Opsional. Semakin jelas, semakin tepat arahan konselor.</p></div>
<div class="rt-field"><label class="rt-check"><input type="checkbox" id="f7"><span>Saya setuju dihubungi konselor KLN lewat WhatsApp atau email untuk keperluan konsultasi, dan data saya diproses sesuai <a href="https://kampusluarnegeri.com/privasi" style="color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px">Kebijakan Privasi</a> dan <a href="https://kampusluarnegeri.com/syarat" style="color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px">Syarat Penggunaan</a>.</span></label><p class="rt-help">Jika kamu berusia di bawah 18 tahun, mintalah orang tua atau wali menyetujuinya.</p></div>
<button class="rt-btn rt-btn-primary" type="submit">Kirim permintaan</button></form>
</body>
</html>
