<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Logo preview</title>
<style>
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-4)}
.pane{display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start;padding:var(--space-5);border-radius:var(--radius-lg);border:1px solid var(--line)}
.pane img{width:200px;max-width:100%;height:auto;display:block}
.pane-light{background:#ffffff}
.pane-dark{background:#0a1a30;border-color:#27415f}
.cap{font:500 12px/16px var(--font-sans)}
.pane-light .cap{color:#44546b} .pane-dark .cap{color:#a9b9ce}
</style></head>
<body>
<div class="pair">
<div class="pane pane-light"><img src="/_blob/5e64272e35762d41922bd867104a19c6" alt="Logo KLN Kampus Luar Negeri, versi navy"><span class="cap">Navy, untuk latar terang</span></div>
<div class="pane pane-dark"><img src="/_blob/8f6660d1eaf0460cbc55142c9f5da8ee" alt="Logo KLN Kampus Luar Negeri, versi putih"><span class="cap">Putih, untuk latar gelap dan brand</span></div>
</div>
</body>
</html>
