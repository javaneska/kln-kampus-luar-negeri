<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>TextField preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"></head>
<body>
<div class="rt-stack">
<div class="rt-field"><label class="rt-label" for="n1">Nama lengkap</label><input class="rt-input" id="n1" value="Raka Pratama"><p class="rt-help">Sesuai paspor atau KTP.</p></div>
<div class="rt-field"><label class="rt-label" for="n2">Nomor WhatsApp</label><input class="rt-input" id="n2" placeholder="Contoh: 0812 0000 0000"><p class="rt-help">Konselor menghubungi lewat nomor ini.</p></div>
<div class="rt-field rt-field-error"><label class="rt-label" for="n3">Email</label><input class="rt-input" id="n3" value="raka@" aria-invalid="true" aria-describedby="e3"><p class="rt-error" id="e3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>Alamat email belum lengkap. Tambahkan nama domain, misalnya @gmail.com.</p></div>
</div>
</body>
</html>
